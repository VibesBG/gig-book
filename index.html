<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1217">
<title>Chords Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: one song per screen, sticky title bar, song toolbar (key / capo / tempo / chords), chord bars as wrapping chips, thumb-reach dock (prev · scroll · next). Dark "stage" first, light "daylight" for outdoor gigs. */
:root{
  --bg:#0f1217; --panel:#171b22; --chip:#1f2530; --line:#2b3240;
  --fg:#eef1f5; --muted:#8d97a7; --accent:#ffb547; --accent-ink:#1a1206; --accent-soft:rgba(255,181,71,.14);
  --ok:#5fd39a; --shade:rgba(5,7,10,.6);
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-chord:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --scale:1;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f5f7; --panel:#ffffff; --chip:#ffffff; --line:#d3d8e0;
  --fg:#0f141b; --muted:#5b6575; --accent:#b4650a; --accent-ink:#ffffff; --accent-soft:rgba(180,101,10,.12);
  --ok:#1d8a55; --shade:rgba(15,20,27,.35);
  color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#f4f5f7; --panel:#ffffff; --chip:#ffffff; --line:#d3d8e0;
  --fg:#0f141b; --muted:#5b6575; --accent:#b4650a; --accent-ink:#ffffff; --accent-soft:rgba(180,101,10,.12);
  --ok:#1d8a55; --shade:rgba(15,20,27,.35);
  color-scheme:light;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.bar h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6vw,40px);line-height:1;letter-spacing:.01em;
  text-transform:uppercase;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .num{color:var(--accent);margin-right:.3em}
.tool{flex:none;min-width:44px;height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.beat{width:14px;height:14px;border-radius:50%;background:var(--line);flex:none}
.beat.on{background:var(--accent)}
.beat.on.one{background:var(--ok)}

/* list view */
.list{padding-block:14px 40px;display:grid;gap:18px}
.switch{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(120px,1fr);overflow-x:auto;scrollbar-width:none;gap:6px;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.sw{min-height:56px;border:0;border-radius:10px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px}
.sw b{font-family:var(--f-display);font-weight:800;font-size:clamp(17px,4.6vw,22px);text-align:center;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.sw small{font-size:12px;color:var(--muted)}
.sw[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.sw[aria-selected="true"] small{color:var(--accent-ink);opacity:.8}
.findrow{display:flex;gap:8px;align-items:center}
.find{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 14px;font-size:16px}
.find::placeholder{color:var(--muted)}
.set h2{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:20px;
  color:var(--muted);margin:0 0 8px;display:flex;align-items:baseline;gap:10px}
.set h2 small{font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:0;text-transform:none}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:6px}
.row{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:56px;padding:10px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.row:active{transform:scale(.99)}
.row .n{font-family:var(--f-chord);font-weight:600;color:var(--muted);width:2.4ch;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.row .t{flex:1;min-width:0;font-weight:600;font-size:17px}
.row .t small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.row.current{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.row.played{opacity:.55}
.row.played .n{color:var(--ok)}
.brk{grid-column:1/-1;text-align:center;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);padding:6px;border:1px dashed var(--line);border-radius:12px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.card{border:1px solid var(--accent);border-radius:16px;background:var(--panel);padding:16px 18px}
.card h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:26px;margin:0 0 6px;letter-spacing:.02em}
.card p{margin:0 0 12px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.items{display:grid;gap:6px}
.it{display:flex;gap:6px;align-items:center}
.ittitle{flex:1;min-width:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:52px;padding:6px 12px;cursor:pointer}
.ittitle b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ittitle small{display:block;color:var(--muted);font-size:12px}
.itset,.itbrk{flex:1}
.itset{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.itbrk{color:var(--accent);border-style:dashed}
.itb{display:flex;gap:4px;flex:none}
.tool:disabled{opacity:.3;cursor:default}
.fl,.form label{display:grid;gap:4px;color:var(--muted);font-size:14px;font-weight:600}
.form{display:grid;gap:12px}
.form input,.form textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;color:var(--fg)}
.form textarea.chart{min-height:40vh;padding:10px 12px;font-family:var(--f-chord);line-height:1.5;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ln{border-radius:10px;cursor:pointer;transition:background .25s,box-shadow .25s}
.ln.now{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.hint{margin:0;color:var(--muted);font-size:14px}
.tip{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent);font-size:15px}
.help{display:grid;gap:14px}
.help h4{margin:0 0 4px;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:19px}
.help p{margin:0;color:var(--muted);line-height:1.5}
.help pre{margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--fg);font-family:var(--f-chord);font-size:14px;white-space:pre-wrap}
.listacts .tbtn{height:44px}
.backup{display:flex;gap:10px;align-items:center;margin:0 0 12px;padding:10px 12px;border:1px solid var(--accent);border-radius:12px;font-size:14px;color:var(--muted)}
.backup span{flex:1;min-width:0}.backup .tbtn{flex:none}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-weight:600}
.pick{display:grid;gap:4px;max-height:38vh;overflow:auto;padding:2px}
.form .pk{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;color:var(--fg);font-weight:500}
.pk input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}
.pk span{min-width:0;flex:1;text-align:left}
.pk b{font-weight:600}
.pk small{display:block;color:var(--muted);font-size:12px}
.pickhead{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;font-weight:600}
.pickhead span{display:flex;gap:14px}
.got{margin:0 0 12px;padding-left:20px;color:var(--fg)}
.got li{margin:2px 0}

.pills{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.pill{font-family:var(--f-chord);font-weight:600;font-size:13px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.capo{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill.moved{border-color:var(--accent);color:var(--accent)}

/* song toolbar */
.song{padding-block:14px 150px}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-bottom:6px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.step button{width:44px;height:48px;border:0;background:transparent;cursor:pointer;font-size:20px;font-weight:600}
.step button:active{background:var(--chip)}
.step .v{min-width:4.2em;text-align:center;display:flex;flex-direction:column;line-height:1.05;padding:0 2px}
.step .v small{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.step .v b{font-family:var(--f-chord);font-size:20px}
.step.moved{border-color:var(--accent)}
.step.moved .v b{color:var(--accent)}
.tbtn{height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tbtn small{font-weight:500;color:var(--muted);font-size:12px}
.tbtn[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
.sub{font-size:14px;color:var(--muted);margin:0 0 12px;display:flex;flex-wrap:wrap;gap:4px 14px}
.sub b{color:var(--fg);font-weight:600}

.sec{display:grid;grid-template-columns:8.5rem 1fr;gap:6px 14px;padding-block:10px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec.cont{border-top:0;padding-top:0}
.sec-l{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  font-size:calc(19px*var(--scale));color:var(--muted);padding-top:6px;line-height:1.1}
.sec-b{min-width:0;display:grid;gap:6px}
.ln{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ch{font-family:var(--f-chord);font-weight:700;font-size:calc(21px*var(--scale));line-height:1;
  padding:.42em .55em;border-radius:8px;background:var(--chip);border:1px solid var(--line);white-space:nowrap;cursor:pointer;max-width:100%}
@media (max-width:420px){.ch{white-space:normal;overflow-wrap:anywhere}}
.ch:active{border-color:var(--accent)}
.rep{font-family:var(--f-chord);font-weight:700;font-size:calc(17px*var(--scale));line-height:1;padding:.45em .6em;border-radius:8px;
  background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.note{font-size:calc(15px*var(--scale));color:var(--muted);font-style:italic}
.note.loud{color:var(--accent);font-style:normal;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.webflag{color:var(--accent);font-weight:600}
.srcs{margin-top:22px;display:grid;gap:4px;font-size:14px;color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:12px}
.srcs b{color:var(--fg)}
.srcs p{margin:0}
.srcs a{color:var(--accent);overflow-wrap:anywhere}
.mynote{margin-top:22px;display:grid;gap:6px}
.mynote label{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-size:17px}
.mynote textarea{width:100%;min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:10px 12px;resize:vertical;font-size:calc(16px*var(--scale))}
@media (max-width:600px){
  .sec{grid-template-columns:1fr;gap:6px}
  .sec-l{padding-top:0}
}

/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.nav{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;padding:6px 14px;text-align:left;min-width:0}
.nav.next{text-align:right;background:var(--accent-soft);border-color:var(--accent)}
.nav small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav b{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav:disabled{opacity:.35;cursor:default}
.scroller{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.scroller button{height:60px;border:0;background:transparent;cursor:pointer}
.scroller .sm{width:34px;font-size:18px;color:var(--muted)}
.scroller .play{min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1}
.scroller .play small{font-size:10px;color:var(--muted);letter-spacing:.08em;margin-top:3px}
.scroller.on{border-color:var(--accent)}
.scroller.on .play{color:var(--accent)}
@media (max-width:420px){.nav{padding:6px 10px}.nav b{font-size:14px}}

/* bottom sheet */
.shade{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;
  border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h3{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.02em}
.diagrams{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.dg{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.dg b{font-family:var(--f-chord);font-size:18px}
.dg small{font-size:11px;color:var(--muted);text-align:center}
.dg svg{width:100%;max-width:120px;height:auto}
.dg .str{stroke:var(--muted);stroke-width:1}
.dg .nut{stroke:var(--fg);stroke-width:4}
.dg .dot{fill:var(--accent)}
.dg .open{fill:none;stroke:var(--fg);stroke-width:1.4}
.dg .mute{stroke:var(--muted);stroke-width:1.6}
.dg .lbl{fill:var(--muted);font:600 9px var(--f-body)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.opt span{min-width:0}
.opt small{display:block;color:var(--muted);font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{min-width:48px;height:44px;border:0;background:transparent;cursor:pointer;font-weight:600;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bigbpm{font-family:var(--f-chord);font-size:64px;font-weight:700;text-align:center;line-height:1;margin:6px 0 2px}
.bpmrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.bpmrow .tbtn{min-width:64px;justify-content:center}
.tbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;
  background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center;width:max-content}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header class="bar">
    <button class="tool" id="homeBtn" aria-label="All songs" hidden>☰</button>
    <h1 id="title">Chords Sheet</h1>
    <span class="beat" id="beat" hidden></span>
    <button class="tool" id="optBtn" aria-label="Display settings">Aa</button>
  </header>
  <main id="view"></main>
</div>
<nav class="dock" id="dock" hidden>
  <div class="dock-in">
    <button class="nav" id="prevBtn"><small>‹ Previous</small><b id="prevT"></b></button>
    <div class="scroller" id="scroller">
      <button class="sm" id="slower" aria-label="Scroll slower">−</button>
      <button class="play" id="scrollBtn" aria-label="Auto-scroll"><span id="scrollIcon">▶</span><small id="scrollSpd">SPD 4</small></button>
      <button class="sm" id="faster" aria-label="Scroll faster">+</button>
    </div>
    <button class="nav next" id="nextBtn"><small>Next ›</small><b id="nextT"></b></button>
  </div>
</nav>
<input type="file" id="gigFile" accept=".json,application/json,text/plain" hidden>
<div id="sheetHost"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* Pure logic shared by the app and the tests. No DOM access here. */
const CHORD=/^[A-G](#|b)?(maj13|maj11|maj9|maj7|maj|M7|min|m7b5|m11|m9|m7|m6|m|dim7|dim|°7|°|ø7|ø|aug|\+|sus2|sus4|sus|add2|add4|add9|add11|6\/9|b5|#5|b9|#9|#11|b13|5|6|7|9|11|13|\((maj7|\+oct|[#b]?\d+)\))*(\/[A-G](#|b)?)?$/;
const isChordWord=w=>{const p=w.split(/-|→|\.\.\./).filter(Boolean);return p.length>0&&p.every(x=>CHORD.test(x))};
function tokens(line){
  const out=[];
  line.split('│').forEach(seg=>{
    seg=seg.trim(); if(!seg) return;
    seg.split(/(\/[^\/]+\/)/).forEach(part=>{
      part=part.trim(); if(!part) return;
      let m=part.match(/^\/x(\d+)\/$/);
      if(m){out.push({k:'rep',v:'×'+m[1]});return}
      if(/^\/.+\/$/.test(part)){out.push({k:'loud',v:part.slice(1,-1).trim()});return}
      m=part.match(/^×\s*(\d+)$/);
      if(m){out.push({k:'rep',v:'×'+m[1]});return}
      const w=part.split(/\s+/); let i=0;
      while(i<w.length&&isChordWord(w[i])) i++;
      if(i>0) out.push({k:'ch',v:w.slice(0,i).join(' ')});
      if(i<w.length) out.push({k:'note',v:w.slice(i).join(' ')});
    });
  });
  return out;
}

/* ---------- typed chart <-> sections ---------- */
// A chord line has a bar (| or │) or starts with a chord. Anything else is a section label.
const PART_WORD=/^(part|section|част|частта|секция|дял)$/i;
const isChordLine=l=>{ if(/[|│]/.test(l)) return true; const w=l.split(/\s+/); return isChordWord(w[0])&&!(w.length===2&&PART_WORD.test(w[1])); };
function parseChart(text){
  const out=[]; let cur=null, blank=false;
  String(text||'').replace(/\r/g,'').split('\n').forEach(raw=>{
    const l=raw.trim();
    if(!l){ blank=true; return; }
    if(isChordLine(l)){
      // a bar before the repeat mark keeps "Am/G  /x2/" from reading as a /…/ note
      let line=l.replace(/\|/g,'│').replace(/\s*\(?\s*(?:[x×х]\s*(\d+)|(\d+)\s*[x×х])\s*\)?\s*$/i,(m,a,b)=>' │  /x'+(a||b)+'/').replace(/│\s*│(  \/x\d+\/)$/,'│$1');
      if(!cur||(blank&&cur.c.length)){ cur={l:'',c:[]}; out.push(cur); }
      cur.c.push(line);
    } else {
      cur={l:l.replace(/^\[\s*|\s*\]$/g,'').replace(/\s*:$/,'').trim(),c:[]}; out.push(cur);
    }
    blank=false;
  });
  return out;
}
function chartLine(line){
  const m=line.match(/^(.*?)\s*\/x(\d+)\/\s*$/);
  let body=(m?m[1]:line).replace(/│/g,'|').trim().replace(/^\|\s*/,'').replace(/\s*\|$/,'').trim();
  if(!/\|/.test(body)&&!isChordWord(body.split(/\s+/)[0]||'')) body='| '+body; // keep it a chord line on the way back
  return body+(m?'  x'+m[2]:'');
}
function serializeChart(sections){
  return (sections||[]).map(s=>[s.l?(isChordLine(s.l)?'['+s.l+']':s.l):null].concat(s.c.map(chartLine)).filter(x=>x!==null).join('\n')).join('\n\n');
}

const newId=now=>'u'+now.toString(36);

// Files come from other people: keep only the fields the app knows, with the right types.
const str=v=>typeof v==='string'?v:(typeof v==='number'?String(v):'');
function sanitizeSong(x){
  if(!x||typeof x!=='object') return null;
  if(typeof x.break==='string') return {break:x.break};
  const title=str(x.title).trim(); if(!title) return null;
  const capo=str(x.capo).trim();
  const y={title,key:str(x.key).trim()||'C',capo:/^[0-9]$/.test(capo)&&capo!=='0'?capo:'',
    sections:(Array.isArray(x.sections)?x.sections:[]).filter(s=>s&&typeof s==='object').map(s=>({l:str(s.l),c:(Array.isArray(s.c)?s.c:[]).filter(l=>typeof l==='string')}))};
  if(str(x.artist)) y.artist=str(x.artist);
  if('bpm' in x){ const b=parseInt(x.bpm,10); y.bpm=(String(b)===str(x.bpm).trim()&&b>=30&&b<=300)?b:null; }
  if('beats' in x){ const b=parseInt(x.beats,10); if(String(b)===str(x.beats).trim()&&b>=2&&b<=12) y.beats=b; }
  if(x.web===true) y.web=true;
  if(Array.isArray(x.sources)) y.sources=x.sources.filter(u=>typeof u==='string'&&/^https?:\/\//i.test(u));
  if(str(x.webNote)) y.webNote=str(x.webNote);
  if(x.tip&&typeof x.tip==='object') y.tip={en:str(x.tip.en),bg:str(x.tip.bg)};
  return y;
}
function sanitizeGig(g){
  if(!g||typeof g.id!=='string'||!/^[a-z0-9]+$/.test(g.id)||typeof g.name!=='string'||!Array.isArray(g.sets)) return null;
  return {id:g.id,name:g.name,sets:g.sets.filter(s=>s&&typeof s==='object').map(s=>({name:str(s.name),songs:(Array.isArray(s.songs)?s.songs:[]).map(sanitizeSong).filter(Boolean)}))};
}
const sanitizeGigs=a=>Array.isArray(a)?a.map(sanitizeGig).filter(Boolean):[];
function validateGigFile(o){
  if(!o||o.kind!=='setlists-gigs'||!Array.isArray(o.gigs)) return {ok:false,error:'not a setlist file'};
  const gigs=sanitizeGigs(o.gigs);
  return gigs.length===o.gigs.length?{ok:true,gigs}:{ok:false,error:'broken gig in file'};
}
const makeGigFile=(gigs,today)=>({kind:'setlists-gigs',v:1,made:today,gigs:clone(gigs)});
const importConflicts=(existing,incoming)=>incoming.filter(g=>existing.some(e=>e.id===g.id)).map(g=>g.id);
// Updating a gig from a file someone sent: their songs come in, and songs you have that
// weren't in the file stay (added at the end), so a partial send never deletes anything.
function keepMissing(local,incoming,tk){
  const out=clone(incoming); if(!local) return out;
  const have=new Set(); out.sets.forEach(s=>s.songs.forEach(x=>{ if(x[tk]!==undefined) have.add(x[tk]); }));
  const extra=[]; local.sets.forEach(s=>s.songs.forEach(x=>{ if(x[tk]!==undefined&&!have.has(x[tk])){ have.add(x[tk]); extra.push(clone(x)); } }));
  if(extra.length){ if(!out.sets.length) out.sets.push({name:'',songs:[]}); out.sets[out.sets.length-1].songs.push(...extra); }
  return out;
}
function applyImport(existing,incoming,mode){
  const out=clone(existing);
  clone(incoming).forEach(g=>{
    const i=out.findIndex(e=>e.id===g.id);
    if(i<0){ out.push(g); return; }
    if(mode==='replace'){ out[i]=g; return; }
    let n=2; while(out.some(e=>e.id===g.id+n)) n++;
    g.id=g.id+n; g.name=g.name+' ('+n+')'; out.push(g);
  });
  return out;
}

/* ---------- gig editor list ---------- */
function flattenGig(gig){
  const items=[];
  gig.sets.forEach((s,i)=>{
    if(s.name||i>0) items.push({k:'set',name:s.name});
    s.songs.forEach(x=>items.push(x.break!==undefined?{k:'break',text:x.break}:{k:'song',song:x}));
  });
  return items;
}
function unflattenGig(items){
  const sets=[];
  items.forEach(it=>{
    if(it.k==='set'){ sets.push({name:it.name,songs:[]}); return; }
    if(!sets.length) sets.push({name:'',songs:[]});
    sets[sets.length-1].songs.push(it.k==='break'?{break:it.text}:it.song);
  });
  return sets;
}

/* ---------- auto-scroll timing ---------- */
// One chord box between bar lines = one bar. A ×N repeat plays the bars since the previous
// repeat (or the start of the line) N times: "│ C │ G │ /x3/ │ D │" = C G C G C G D.
const BARLIKE=/^(N\.?C\.?|%|[A-H][#b]?[^\s\/]*(\/[A-H][#b]?)?)$/;
function lineBeats(line,beatsPerBar){
  let bars=0, group=0; const barred=/│/.test(line);
  String(line).split('│').forEach(seg=>{
    seg=seg.trim(); if(!seg) return;
    const r=seg.match(/\/x(\d+)\/\s*$/)||seg.match(/^×\s*(\d+)$/);
    const body=seg.replace(/\/x\d+\/\s*$/,'').replace(/^×\s*\d+$/,'').trim();
    // a box is a bar when it holds a chord, even one the app doesn't know, or N.C. or %; words like "riff" don't count
    const words=body.split(/\s+/).filter(w=>isChordWord(w)||BARLIKE.test(w));
    if(words.length) group+=barred?1:words.length;   // without bar lines ("G D Am C") each chord is a bar
    if(r){ bars+=group*(parseInt(r[1],10)||1); group=0; }
  });
  return Math.max(1,bars+group)*(beatsPerBar||4);
}
// Every chord line of the song in screen order, with its start and length in beats.
function songTimeline(sections,beatsPerBar){
  const out=[]; let at=0;
  (sections||[]).forEach(s=>s.c.forEach(line=>{ const b=lineBeats(line,beatsPerBar); out.push({start:at,beats:b}); at+=b; }));
  return out;
}

/* ---------- share links ---------- */
// A share link is <app address>#get=<code>. Everything after # stays on the phones: GitHub never sees it.
// code = "z" + base64url(deflate(JSON)), or "j" + base64url(JSON) where the browser can't compress.
function b64uEnc(bytes){ let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64uDec(s){ const b=atob(String(s).replace(/-/g,'+').replace(/_/g,'/').replace(/\s+/g,'')); const out=new Uint8Array(b.length); for(let i=0;i<b.length;i++) out[i]=b.charCodeAt(i); return out; }
const pipeBytes=(bytes,stream)=>new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(b=>new Uint8Array(b));
async function packShare(obj,noZip){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(!noZip&&typeof CompressionStream==='function'){ try{ return 'z'+b64uEnc(await pipeBytes(raw,new CompressionStream('deflate-raw'))); }catch(e){} }
  return 'j'+b64uEnc(raw);
}
async function unpackShare(code){
  code=String(code||''); const kind=code[0]; let bytes=b64uDec(code.slice(1));
  if(kind==='z'){ if(typeof DecompressionStream!=='function') throw new Error('old browser'); bytes=await pipeBytes(bytes,new DecompressionStream('deflate-raw')); }
  else if(kind!=='j') throw new Error('not a share code');
  return JSON.parse(new TextDecoder().decode(bytes));
}
// The part of a link after #get= (the link may have been pasted with text around it).
const shareCodeOf=text=>{ const m=String(text||'').match(/#get=([A-Za-z0-9_-]+)/); return m?m[1]:null; };
const senderName=v=>typeof v==='string'?v.replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,40):'';

    .filter(s=>s.songs.some(x=>x.title!==undefined||x.t!==undefined))};
}

/* ---------- music theory ---------- */
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const PC={C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,'E#':5,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};
const FLAT_KEYS=new Set(['F','Bb','Eb','Ab','Db','Gb','Dm','Gm','Cm','Fm','Bbm','Ebm']);
const mod=n=>((n%12)+12)%12;
function keyName(key,shift){ // "G#m" + 3 -> "Bm"
  const m=key.match(/^([A-G][#b]?)(m?)/); if(!m) return key;
  const pc=mod(PC[m[1]]+shift);
  const sharp=SH[pc]+m[2], flat=FL[pc]+m[2];
  if(prefs.acc==='sharp') return sharp; if(prefs.acc==='flat') return flat;
  return FLAT_KEYS.has(flat)?flat:sharp;
}
function useFlats(targetKey){ if(prefs.acc!=='auto') return prefs.acc==='flat'; return FLAT_KEYS.has(targetKey)||/^[A-G]b/.test(targetKey); }
function simpleQ(q){ q=q.replace('(+oct)',''); if(/^dim/.test(q)) return 'dim'; if(q==='5') return '5'; if(/^m(?!aj)/.test(q)||/^min/.test(q)) return 'm'; return ''; }
// Transpose / simplify one chip of chord text ("Em-Bm-C", "G A", "D/F#")
function xform(text,shift,flats){
  if(prefs.simple) text=text.replace(/([A-G][#b]?)([^\s\-→\/.]*)(\/[A-G][#b]?)?/g,(a,r,q)=>r+simpleQ(q));
  if(!shift) return text;
  return text.replace(/[A-G][#b]?/g,n=>(flats?FL:SH)[mod(PC[n]+shift)]);
}

/* ---------- chord diagrams ---------- */
// frets low E -> high e, null = muted
const OPEN={A:[null,0,2,2,2,0],Am:[null,0,2,2,1,0],A7:[null,0,2,0,2,0],Am7:[null,0,2,0,1,0],Amaj7:[null,0,2,1,2,0],Asus4:[null,0,2,2,3,0],Asus2:[null,0,2,2,0,0],
  B7:[null,2,1,2,0,2],C:[null,3,2,0,1,0],Cadd9:[null,3,2,0,3,0],C7:[null,3,2,3,1,0],Cmaj7:[null,3,2,0,0,0],
  D:[null,null,0,2,3,2],Dm:[null,null,0,2,3,1],D7:[null,null,0,2,1,2],Dsus4:[null,null,0,2,3,3],Dsus2:[null,null,0,2,3,0],Dmaj7:[null,null,0,2,2,2],
  E:[0,2,2,1,0,0],Em:[0,2,2,0,0,0],E7:[0,2,0,1,0,0],Em7:[0,2,2,0,3,0],Esus4:[0,2,2,2,0,0],
  G:[3,2,0,0,0,3],G7:[3,2,0,0,0,1],Fmaj7:[null,null,3,2,1,0],
  'D/F#':[2,null,0,2,3,2],'G/F#':[2,null,0,0,3,3],'C/B':[null,2,2,0,1,0],'Am/G':[3,0,2,2,1,0],'C/G':[3,3,2,0,1,0]};
const ESHAPE={'':[0,2,2,1,0,0],m:[0,2,2,0,0,0],'7':[0,2,0,1,0,0],m7:[0,2,0,0,0,0],maj7:[0,null,1,1,0,null],sus4:[0,2,2,2,0,0],'5':[0,2,2,null,null,null],'6':[0,2,2,1,2,0]};
const ASHAPE={'':[null,0,2,2,2,0],m:[null,0,2,2,1,0],'7':[null,0,2,0,2,0],m7:[null,0,2,0,1,0],maj7:[null,0,2,1,2,0],sus4:[null,0,2,2,3,0],sus2:[null,0,2,2,0,0],
  '5':[null,0,2,2,null,null],dim:[null,0,1,2,1,null],dim7:[null,0,1,2,1,2],'6':[null,0,2,2,2,2],'9':[null,0,-1,0,0,0],add9:[null,0,2,4,2,0]};
function normQ(q){ q=q.replace('(+oct)','').replace(/^min/,'m'); if(q==='sus') q='sus4';
  const near={maj9:'maj7',maj:'',m9:'m7',m6:'m','11':'7','13':'7',aug:'',add11:''}; return q in near?[near[q],true]:[q,false]; }
function shapeFor(name){
  const m=name.match(/^([A-G][#b]?)(.*?)(?:\/([A-G][#b]?))?$/); if(!m) return null;
  const root=m[1], bass=m[3]||'';
  const nat=SH[PC[root]], flt=FL[PC[root]];
  for(const r of [root,nat,flt]){ if(OPEN[r+m[2]+(bass?'/'+bass:'')]) return {f:OPEN[r+m[2]+(bass?'/'+bass:'')],bass:'',approx:false}; }
  let [q,approx]=normQ(m[2]);
  for(const r of [root,nat,flt]){ if(OPEN[r+q]) return {f:OPEN[r+q],bass,approx}; }
  const pc=PC[root], cands=[];
  if(ESHAPE[q]){ let f=mod(pc-4); cands.push([f,ESHAPE[q]]); }
  if(ASHAPE[q]){ let f=mod(pc-9); if(ASHAPE[q].some(v=>v!==null&&v<0)&&f<1) f+=12; cands.push([f,ASHAPE[q]]); }
  if(!cands.length){ const fb=/^m(?!aj)/.test(q)?'m':''; return shapeFor(root+fb) && Object.assign(shapeFor(root+fb),{bass,approx:true}); }
  cands.sort((a,b)=>a[0]-b[0]);
  const [r,t]=cands[0];
  return {f:t.map(v=>v===null?null:v+r),bass,approx,barre:r>0?r:0,rootStr:t[0]===null?1:0};
}
function diagramSVG(sh){
  const f=sh.f, played=f.filter(v=>v!==null&&v>0);
  const maxF=Math.max(0,...played), minF=played.length?Math.min(...played):0;
  const base=maxF<=4?1:minF;
  const X=i=>14+i*14, Y=j=>26+j*17;
  let s=`<svg viewBox="0 0 100 120" role="img">`;
  for(let i=0;i<6;i++) s+=`<line class="str" x1="${X(i)}" y1="${Y(0)}" x2="${X(i)}" y2="${Y(5)}"/>`;
  for(let j=0;j<=5;j++) s+=`<line class="str" x1="${X(0)}" y1="${Y(j)}" x2="${X(5)}" y2="${Y(j)}"/>`;
  if(base===1) s+=`<line class="nut" x1="${X(0)-1}" y1="${Y(0)}" x2="${X(5)+1}" y2="${Y(0)}"/>`;
  else s+=`<text class="lbl" x="${X(5)+5}" y="${Y(0)+12}">${base}fr</text>`;
  if(sh.barre&&sh.barre>=base){ const row=sh.barre-base+1; s+=`<rect class="dot" x="${X(sh.rootStr)-5}" y="${Y(row)-13.5}" width="${X(5)-X(sh.rootStr)+10}" height="10" rx="5"/>`; }
  f.forEach((v,i)=>{
    if(v===null) s+=`<path class="mute" d="M${X(i)-4} 9l8 8M${X(i)+4} 9l-8 8"/>`;
    else if(v===0) s+=`<circle class="open" cx="${X(i)}" cy="13" r="4"/>`;
    else s+=`<circle class="dot" cx="${X(i)}" cy="${Y(v-base+1)-8.5}" r="5.5"/>`;
  });
  return s+'</svg>';
}
function diagramsHTML(names){
  return '<div class="diagrams">'+names.map(n=>{

}

/* ---------- wake lock ---------- */
let lock=null,wantLock=false;
async function grabLock(){ const l=await navigator.wakeLock.request('screen'); l.addEventListener('release',()=>{ if(lock===l) lock=null; }); lock=l; }
async function wakeOn(){
  wantLock=true;
  if(!('wakeLock' in navigator)){toast(tr('Can’t keep the screen on here — raise Auto-Lock in settings'));return}
  try{ await grabLock(); toast(tr('Screen stays on')); }
  catch(e){ lock=null; toast(tr('Screen lock not allowed here')); }
}
async function wakeOff(){ wantLock=false; try{ if(lock) await lock.release(); }catch(e){} lock=null; toast(tr('Screen can turn off')); }
document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState!=='visible') return;
  if(metro.on&&metro.ctx&&metro.next<metro.ctx.currentTime) metro.next=metro.ctx.currentTime+.05;   // no burst of missed clicks
  if(wantLock&&!lock){ try{await grabLock()}catch(e){} } });

/* ---------- auto-scroll: counts you in, then follows the song one line at a time ---------- */
let scrolling=false, playTimer=0, playLine=0;
const playLines=()=>[...view.querySelectorAll('.song .ln')];
const songBpm=()=>cur>=0?bpmOf(SONGS[cur]):null;
function glideTo(el){
  if(!el) return;
  const sec=el.closest('.sec'), first=sec&&sec.querySelector('.ln')===el; // keep the section name in view
  const top=(first?sec:el).getBoundingClientRect().top+window.scrollY-document.querySelector('.bar').getBoundingClientRect().bottom-10;
  window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
}
function markLine(i,glide){ const ls=playLines(); ls.forEach((l,k)=>l.classList.toggle('now',k===i)); if(glide) glideTo(ls[i]); }
function startScroll(){
  if(cur<0) return;
  const bpm=songBpm(); if(!bpm){ toast(tr('Set a tempo first')); openTempo(); return; }
  const lines=playLines(); if(!lines.length){ toast(tr('No chords to follow')); return; }
  if(playLine>=lines.length) playLine=0;
  scrolling=true; syncScrollUI(); if(!lock&&!wantLock) wakeOn();
  if(metro.on) metroStop();
  metro.bpm=bpm; metroStart(true); metro.byScroll=true;   // four clicks, then the click keeps going with the song
  glideTo(lines[playLine]);
  playTimer=setTimeout(()=>playFrom(playLine),(SONGS[cur].beats||4)*60000/bpm);   // …then go
}
function playFrom(i){
  if(!scrolling||cur<0) return;
  const s=SONGS[cur], tl=songTimeline(s.sections,s.beats||4);
  if(i>=tl.length){ stopScroll(); playLine=0; markLine(-1); toast(tr('End of song')); return; }
  playLine=i; markLine(i,true);
  playTimer=setTimeout(()=>playFrom(i+1),tl[i].beats*60000/songBpm());   // tempo nudges apply from the next line
}
function stopScroll(){ const was=scrolling; scrolling=false; clearTimeout(playTimer); if(was&&metro.on&&metro.byScroll) metroStop(); syncScrollUI(); }
function syncScrollUI(){ const b=songBpm(); $('scroller').classList.toggle('on',scrolling); $('scrollIcon').textContent=scrolling?'❚❚':'▶'; $('scrollSpd').textContent='♩ '+(b||'–'); }
function nudgeTempo(d){ if(cur<0) return; const b=songBpm(); if(!b){ openTempo(); return; } const v=saveS(SONGS[cur],{bpm:Math.min(240,Math.max(30,b+d))}); if(metro.on) metro.bpm=v.bpm; syncScrollUI(); }
$('scrollBtn').onclick=()=>scrolling?stopScroll():startScroll();

/* ---------- metronome ---------- */
const metro={on:false,ctx:null,next:0,beat:0,timer:0,song:null,bpm:100,left:-1,taps:[]};
function click(time,accent){
  const c=metro.ctx, o=c.createOscillator(), g=c.createGain();
  o.frequency.value=accent?1600:1000; g.gain.setValueAtTime(.0001,time);
  g.gain.exponentialRampToValueAtTime(.6,time+.002); g.gain.exponentialRampToValueAtTime(.0001,time+.06);
  o.connect(g).connect(c.destination); o.start(time); o.stop(time+.07);
  const b=metro.beat, delay=Math.max(0,(time-c.currentTime)*1000);
  setTimeout(()=>{ if(!metro.on) return; const d=$('beat'); d.hidden=false; d.className='beat on'+(b===0?' one':''); setTimeout(()=>d.className='beat',90); },delay);
}
function schedule(){
  const c=metro.ctx;
  if(metro.next<c.currentTime-.2) metro.next=c.currentTime+.05;
  while(metro.next<c.currentTime+.12){
    click(metro.next,metro.beat===0);
    metro.next+=60/metro.bpm; metro.beat=(metro.beat+1)%(metro.per||4);
    if(metro.left>0&&--metro.left===0){ metro.left=-1; syncMetroUI(); }   // count-in done: keep clicking
  }
}
function metroStart(countIn){ metro.byScroll=false;
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}   // iPhone: click even with the silent switch on
  try{ metro.ctx=metro.ctx||new (window.AudioContext||window.webkitAudioContext)(); metro.ctx.resume(); }catch(e){ toast(tr('Sound isn’t available here')); return; }
  clearInterval(metro.timer);
  metro.on=true; metro.song=SONGS[cur]; metro.beat=0; metro.per=cur>=0&&SONGS[cur].beats||4; metro.left=countIn?metro.per:-1; metro.next=metro.ctx.currentTime+.06;
  metro.timer=setInterval(schedule,25); schedule(); syncMetroUI();
}
function metroStop(){ metro.on=false; clearInterval(metro.timer); $('beat').hidden=true; syncMetroUI(); }
function syncMetroUI(){ const b=$('mStart'); if(b){ b.textContent=metro.on&&metro.left<0?tr('Stop'):tr('Start'); } }
function openTempo(){
  const s=SONGS[cur]; metro.bpm=bpmOf(s)||100;
  openSheet(tr('Tempo · {0}',s.title),`
    <div class="bigbpm" id="mBpm">${metro.bpm}</div><p class="sub" style="justify-content:center">${bpmOf(s)?'BPM':tr('No tempo saved yet — tap or set one')}</p>
    <div class="bpmrow"><button class="tbtn" data-d="-5">−5</button><button class="tbtn" data-d="-1">−1</button><button class="tbtn" data-d="1">+1</button><button class="tbtn" data-d="5">+5</button></div>
    <div class="bpmrow"><button class="tbtn" id="mTap">${tr('Tap tempo')}</button><button class="tbtn" id="mCount">${tr('Count in 4')}</button><button class="tbtn primary" id="mStart">${tr('Start')}</button></div>
    <p class="sub" style="justify-content:center;margin-top:14px">${tr('Changes are saved for this song on this device.')}</p>`,()=>{
    const setB=v=>{ metro.bpm=Math.min(240,Math.max(30,Math.round(v))); $('mBpm').textContent=metro.bpm; saveS(s,{bpm:metro.bpm}); };
    $('sheetHost').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>setB(metro.bpm+(+b.dataset.d)));
    $('mTap').onclick=()=>{ const now=performance.now(); metro.taps=metro.taps.filter(t=>now-t<2500); metro.taps.push(now);
      if(metro.taps.length>=2){ const d=metro.taps.slice(-5); setB(60000/((d[d.length-1]-d[0])/(d.length-1))); } };
    $('mCount').onclick=()=>metroStart(true);
    $('mStart').onclick=()=>metro.on&&metro.left<0?metroStop():metroStart(false);
    syncMetroUI();
  });
}

      <label>${tr('Beats')}<input id="fBeats" type="number" inputmode="numeric" min="2" max="12" value="${s.beats||4}"></label></div>
    <label>${tr('Chords')}<textarea id="fChart" class="chart" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Verse&#10;G | D | Am | C  x2">${esc(serializeChart(s.sections))}</textarea></label>
    <p class="hint">${tr('Section name on its own line. Chords separated by {0}. Add {1} at the end of a line to repeat it.','<b>|</b>','<b>x2</b>')} <button class="linkbtn" id="fSample">${tr('Show example')}</button></p>
    <div class="acts"><button class="tbtn primary" id="fSave">${tr('Save')}</button><button class="tbtn" id="fCancel">${tr('Cancel')}</button>${song?`<button class="tbtn" id="fDelete">${tr('Delete song')}</button>`:''}</div></div>`,()=>{
    $('fCancel').onclick=closeSheetQuiet;
    $('fSample').onclick=()=>{ if(!$('fChart').value.trim()) $('fChart').value='Verse\nG | D | Am | C  x2\nChorus\nC | G | D | D'; };
    const edit=fn=>GIGS.map(g=>{ if(g.id!==gigId) return g; const sets=g.sets.map(st=>Object.assign({},st,{songs:st.songs.slice()})); fn(sets); return Object.assign({},g,{sets}); });
    $('fSave').onclick=()=>{
      const title=$('fTitle').value.trim(); if(!title){ toast(tr('Give the song a title')); $('fTitle').focus(); return; }
      const sections=parseChart($('fChart').value);
      const key=$('fKey').value.trim()||((sections.map(x=>x.c.join(' ')).join(' ').match(/[A-G][#b]?(?:m(?!aj))?/)||['C'])[0]);
      const capo=Math.max(0,Math.min(9,parseInt($('fCapo').value)||0)), bpm=parseInt($('fBpm').value)||0;
      const data=Object.assign(song?plainSong(song):{},{title,artist:$('fArtist').value.trim(),key,capo:capo?String(capo):'',sections});
      if(bpm) data.bpm=Math.max(30,Math.min(240,bpm)); else delete data.bpm;
      const beats=Math.max(2,Math.min(12,parseInt($('fBeats').value)||4)); if(beats!==4) data.beats=beats; else delete data.beats;
      let found=!song;
      const gigs=edit(sets=>{ if(song){ sets.forEach(st=>{ const i=st.songs.indexOf(song); if(i>=0){ st.songs[i]=data; found=true; } }); }
        else { if(!sets.length) sets.push({name:'',songs:[]}); sets[sets.length-1].songs.push(data); } });
      if(!found||!saveGigs(gigs)){ toast(tr(SAVE_FAIL)); return; }
      // a new capo or tempo typed in ✎ Edit replaces the one you set with the buttons
      if(song){ const k='song:'+gigId+':'+song.title, v=store.get(k,null);
        if(v){ if((+song.capo||0)!==capo) delete v.c; if((+song.bpm||0)!==(+data.bpm||0)) delete v.bpm; store.set(k,v); } }
      // move saved key/capo/notes with the song, but never over another song's saved state
      if(song&&song.title!==title){ const o='song:'+gigId+':'+song.title, n='song:'+gigId+':'+title, v=store.get(o,null);
        if(v!==null&&store.get(n,null)===null&&store.set(n,v)) store.del(o); }
      rebuild(); closeSheetQuiet(); route(); toast(tr('Saved'));
    };
    if($('fDelete')) $('fDelete').onclick=()=>{ if(!confirm(tr('Delete “{0}”?',s.title))) return;
      if(commit(edit(sets=>sets.forEach(st=>{ const i=st.songs.indexOf(song); if(i>=0) st.songs.splice(i,1); })))){ closeSheetQuiet(); route(); toast(tr('Song deleted')); } };
  });
}

/* ---------- files: save and load ---------- */
const today=()=>new Date().toISOString().slice(0,10);
function downloadJSON(name,obj){
  const text=JSON.stringify(obj,null,1), blob=new Blob([text],{type:'application/json'});
  try{ const f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){ return navigator.share({files:[f],title:name}).then(()=>true,()=>false); } }catch(e){}
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  return Promise.resolve(true);
}
const fileName=n=>(n.replace(/[\\/:*?"<>|]+/g,'').trim()||'gig')+'.setlist.json';
// Your own backup: the songs plus your key, capo, tempo and notes for each song.
function myState(g){ const out={}; songTitles(g).forEach(x=>{ const v=store.get('song:'+g.id+':'+x.title,null); if(!v) return;
  const o={}; if(+v.t) o.t=+v.t; if(v.c!==undefined&&+v.c!==(+x.capo||0)) o.c=+v.c; if(+v.bpm) o.bpm=+v.bpm; if(v.note) o.note=String(v.note);
  if(Object.keys(o).length) out[x.title]=o; }); return out; }
function saveFile(gigs,name){ const songs={}; gigs.forEach(g=>{ const m=myState(g); if(Object.keys(m).length) songs[g.id]=m; });
  const all=gigs.length===GIGS.length;
  return downloadJSON(name||fileName(gigs[0].name),Object.assign(makeGigFile(gigs.map(plainGig),today()),{songs}))
    .then(ok=>{ if(ok&&all){ store.set('saved',Date.now()); if(cur<0&&!editing&&$('listBody')) showList(); } return ok; }); }
function restoreMine(gigs,songs){
  if(!songs||typeof songs!=='object') return;
  gigs.forEach(g=>{ const m=songs[g.id]; if(!m||typeof m!=='object') return; songTitles(g).forEach(x=>{ const v=m[x.title]; if(!v||typeof v!=='object') return;
    const k='song:'+g.id+':'+x.title, cur=store.get(k,{}), t=parseInt(v.t,10), c=parseInt(v.c,10), b=parseInt(v.bpm,10);
    if(t>=-11&&t<=11) cur.t=t; if(c>=0&&c<=9) cur.c=c; if(b>=30&&b<=300) cur.bpm=b; if(typeof v.note==='string') cur.note=v.note.slice(0,5000);
    if(!store.set(k,cur)) warnSave(); }); });
}
function pickFile(){ $('gigFile').click(); }
function finishImport(incoming,mode,songs){
  const before=new Set(GIGS.map(g=>g.id));
  if(songs) restoreMine(incoming.filter(g=>mode==='replace'||!before.has(g.id)),songs);
  if(!commit(applyImport(GIGS.map(plainGig),incoming,mode))) return;
  if(songs&&incoming.length>=GIGS.length) store.set('saved',Date.now());   // you just loaded your full backup
  closeSheetQuiet(); toast(incoming.length===1?tr('Loaded 1 gig'):tr('Loaded {0} gigs',incoming.length));
  // open the file's first gig: a new one if it was added, else the one it replaced
  const first=mode==='keep'&&before.has(incoming[0].id)?GIGS.find(g=>!before.has(g.id)):gigById(incoming[0].id);
  if(location.hash==='#'+first.id) route(); else location.hash=first.id;
}
function importText(text){
  let o=null; try{ o=JSON.parse(text); }catch(e){}
  const v=validateGigFile(o); if(!v.ok){ toast(tr('That isn’t a setlist file')); return; }
  if(o.from!==undefined){ offerGigs(v.gigs,senderName(o.from),o.state); return; }   // a file someone sent with ↗ Send
  const clash=importConflicts(GIGS,v.gigs);
  if(!clash.length){ finishImport(v.gigs,'keep',o.songs); return; }
  const names=clash.map(id=>gigById(id).name);
  openSheet(tr('Already on this device'),`<p class="hint" style="margin-bottom:14px">${tr(clash.length===1?'This gig is already here: {0}. Replace it with the file, or keep both?':'These gigs are already here: {0}. Replace them with the file, or keep both?','<b>'+names.map(esc).join(', ')+'</b>')}</p>
    <div class="acts"><button class="tbtn primary" id="impReplace">${tr('Replace')}</button><button class="tbtn" id="impKeep">${tr('Keep both')}</button><button class="tbtn" id="impCancel">${tr('Cancel')}</button></div>`,()=>{
    $('impReplace').onclick=()=>finishImport(v.gigs,'replace',o.songs);
    $('impKeep').onclick=()=>finishImport(v.gigs,'keep');
    $('impCancel').onclick=closeSheetQuiet;
  });
}
$('gigFile').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>importText(rd.result); rd.onerror=()=>toast(tr('Couldn’t read that file')); rd.readAsText(f); };

/* ---------- send to a bandmate (file) ---------- */
const songTitles=g=>{ const a=[]; g.sets.forEach(s=>s.songs.forEach(x=>{ if(x.title!==undefined) a.push(x); })); return a; };
// The sender's key, capo and tempo travel with the songs (the band plays them that way). Notes and ✓ marks don't.
function sendState(g){
  const out={};
  songTitles(g).forEach(x=>{ const v=store.get('song:'+g.id+':'+x.title,null); if(!v) return; const o={};
    if(+v.t) o.t=+v.t; if(v.c!==undefined&&+v.c!==(+x.capo||0)) o.c=+v.c; if(+v.bpm) o.bpm=+v.bpm;
    if(Object.keys(o).length) out[x.title]=o; });
  return out;
}
function applyState(gigs,state){
  if(!state||typeof state!=='object') return;
  gigs.forEach(g=>songTitles(g).forEach(x=>{ const v=state[x.title]; if(!v||typeof v!=='object') return;
    const k='song:'+g.id+':'+x.title, cur=store.get(k,{}), t=parseInt(v.t,10), c=parseInt(v.c,10), b=parseInt(v.bpm,10);
    cur.t=t>=-11&&t<=11?t:0; cur.c=c>=0&&c<=9?c:(+x.capo||0); if(b>=30&&b<=300) cur.bpm=b;
    if(!store.set(k,cur)) warnSave(); }));
}
function openSend(gigId){
  const g=gigById(gigId); if(!g) return;
  const songs=songTitles(g);
  openSheet(tr('Send “{0}”',g.name),`<div class="form">
    <label>${tr('Your name')}<input id="sName" value="${esc(prefs.name||'')}" maxlength="40" autocomplete="name" placeholder="${tr('So they know who sent it')}"></label>
    <div class="pickhead">${tr('Songs to send')}<span><button class="linkbtn" id="sAll">${tr('All')}</button><button class="linkbtn" id="sNone">${tr('None')}</button></span></div>
    <div class="pick">${songs.map((x,i)=>`<label class="pk"><input type="checkbox" data-i="${i}" checked><span><b>${esc(x.title)}</b>${x.artist?`<small>${esc(x.artist)}</small>`:''}</span></label>`).join('')}</div>
    <p class="hint">${tr('Your key, capo and tempo changes go with the songs. Your notes stay private.')}</p>
    <div class="acts"><button class="tbtn primary" id="sFile">${tr('Send file')}</button></div>
    <p class="hint">${tr('Pick Viber, WhatsApp or Messenger, then the person. They save the file and open it with Load a file.')}</p></div>`,()=>{
    const boxes=[...$('sheetHost').querySelectorAll('.pk input')];
    const keep=()=>new Set(boxes.filter(b=>b.checked).map(b=>+b.dataset.i));
    $('sAll').onclick=()=>boxes.forEach(b=>b.checked=true);
    $('sNone').onclick=()=>boxes.forEach(b=>b.checked=false);
    $('sFile').onclick=()=>{
      if(!keep().size){ toast(tr('Pick at least one song')); return; }
      prefs.name=senderName($('sName').value); savePrefs();
      const gig=pickSongs(plainGig(g),keep()), st=sendState(g), mine={}; songTitles(gig).forEach(x=>{ if(st[x.title]) mine[x.title]=st[x.title]; });
      downloadJSON(fileName(g.name),Object.assign(makeGigFile([gig],today()),{from:prefs.name,state:mine}));
    };
  });
}
// Links sent with an earlier version (#get=…) still open.
async function receiveLink(code){
  history.replaceState(null,'',location.pathname+location.search);   // a refresh won't ask again
  route();
  let o=null, old=false; try{ o=await unpackShare(code); }catch(e){ old=e&&e.message==='old browser'; }
  const v=validateGigFile(o);
  if(!v.ok){ openSheet(tr('Link not working'),`<p class="hint">${tr(old?'Update your browser to open this link, or ask for the file.':'This link is broken or was cut off. Ask for it again, or ask for the file.')}</p>`); return; }
  offerGigs(v.gigs,senderName(o.from),o.state);
}
function offerGigs(gigs,from,state){
  const g=gigs[0], titles=songTitles(g).map(x=>x.title), have=gigs.some(x=>gigById(x.id));
  openSheet(from?tr('{0} sent you a gig',from):tr('New gig'),`<p class="hint" style="margin-bottom:8px"><b style="color:var(--fg);font-size:18px">${esc(g.name)}</b> · ${songsN(titles.length)}</p>
    <ul class="got">${titles.slice(0,8).map(t=>`<li>${esc(t)}</li>`).join('')}${titles.length>8?`<li>${tr('and {0} more',titles.length-8)}</li>`:''}</ul>
    ${have?`<p class="hint" style="margin-bottom:8px">${tr('You already have this gig. Updating it keeps your notes and ✓ marks.')} ${tr('Songs you have that aren’t in the file stay.')}</p>`:''}
    ${state&&Object.keys(state).length?`<p class="hint" style="margin-bottom:14px">${tr('The key, capo and tempo of these songs will match the sender’s.')}</p>`:''}
    <div class="acts"><button class="tbtn primary" id="rAdd">${have?tr('Update it'):tr('Add it')}</button><button class="tbtn" id="rCancel">${tr('Cancel')}</button></div>`,()=>{
    $('rAdd').onclick=()=>{ const gs=gigs.map(x=>{ const l=gigById(x.id); return l?keepMissing(plainGig(l),x,'title'):x; }); applyState(gs,state); finishImport(gs,have?'replace':'keep'); };
    $('rCancel').onclick=closeSheetQuiet;
  });
}

/* ---------- navigation ---------- */
function go(i){ location.hash = i<0 ? LIST.id : LIST.id+'-'+(i+1); }
function route(){
  const code=shareCodeOf(location.hash); if(code){ receiveLink(code); return; }
  closeSheetQuiet(); editing=null;
  const em=location.hash.match(/^#edit-([a-z0-9]+)$/);
  if(em&&gigById(em[1])){ useList(em[1]); showGigEditor(em[1]); return; }
  const m=location.hash.match(/^#([a-z0-9]+)(?:-(\d+))?$/);
  useList(m&&LISTS.some(l=>l.id===m[1]) ? m[1] : store.get('list',LISTS[0].id));
  const i=m&&m[2]?+m[2]-1:-1;
  if(i>=0&&i<SONGS.length){ const y=(i===cur)?window.scrollY:0; showSong(i); window.scrollTo(0,y); } else showList();
}
function closeSheetQuiet(){ $('sheetHost').innerHTML=''; }
window.addEventListener('hashchange',route);
$('homeBtn').onclick=()=>go(-1);
$('prevBtn').onclick=()=>cur>0&&go(cur-1);
$('nextBtn').onclick=()=>cur<SONGS.length-1&&go(cur+1);

let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(cur<0||sheetOpen()) return;
  if(e.target.closest&&e.target.closest('textarea')) return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dy)<50){ dx<0?$('nextBtn').click():$('prevBtn').click(); }
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('input,textarea')){ if(e.target.id==='mynote'&&/^Page(Up|Down)$/.test(e.key)) e.target.blur(); else return; }   // a pedal still works after typing a note
  if(e.key==='Escape'){ sheetOpen()?closeSheet():cur>=0&&go(-1); return; }
  if(cur<0||sheetOpen()) return;
  const atBottom=window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4, atTop=window.scrollY<=2;
  if(e.key==='ArrowRight'){e.preventDefault();$('nextBtn').click()}
  else if(e.key==='ArrowLeft'){e.preventDefault();$('prevBtn').click()}
  else if(e.key==='PageDown'||e.key==='ArrowDown'||(e.key===' '&&e.target===document.body)){e.preventDefault(); atBottom?$('nextBtn').click():window.scrollBy(0,window.innerHeight*.75)}
  else if(e.key==='PageUp'||e.key==='ArrowUp'){e.preventDefault(); atTop?$('prevBtn').click():window.scrollBy(0,-window.innerHeight*.75)}
  else if(e.key==='s'){ scrolling?stopScroll():startScroll(); }
});

route();
// Works offline once opened (GitHub Pages only)
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
