<!doctype html><meta charset="utf-8"><body>
<script src="../src/core.js"></script>
<script>
let n=0; const fails=[];
function eq(name,a,b){ try{ const A=typeof a==='function'?a():a; if(JSON.stringify(A)===JSON.stringify(b)) n++; else fails.push('FAIL: '+name+' got '+JSON.stringify(A)); }catch(e){ fails.push('FAIL: '+name+' threw '+e.message); } }
function T(){
eq('parse basic', ()=>parseChart('Verse\nG | Cadd9 | Am7 | C   x2\nChorus\nG | D/F#'),
   [{l:'Verse',c:['G │ Cadd9 │ Am7 │ C │  /x2/']},{l:'Chorus',c:['G │ D/F#']}]);
eq('label brackets/colon', ()=>parseChart('[Intro]\nG D\nOutro:\nC').map(s=>s.l), ['Intro','Outro']);
eq('continuation after blank', ()=>parseChart('Verse\nG | C\n\nAm | F').length, 2);
eq('no label first', ()=>parseChart('G | C')[0].l, '');
const owner=[{l:'Interlude',c:['│ G │ Cadd9 │ Am7 │ D │ G-D/F# │  kick-kick']},{l:'',c:['│ Em │ Am7 │ D7 │  /x2/']},{l:'Outro',c:['│ G │  /LAST TIME SLOW/']}];
eq('round trip tokens', ()=>parseChart(serializeChart(owner)).map(s=>[s.l,s.c.map(l=>tokens(l))]), owner.map(s=>[s.l,s.c.map(l=>tokens(l))]));
eq('slash chord before repeat', ()=>tokens(parseChart('Am Am/G  x2')[0].c[0]), [{k:'ch',v:'Am Am/G'},{k:'rep',v:'×2'}]);
eq('slash chord before repeat round trip', ()=>{const s=[{l:'Chorus',c:['│ F │ C C/B │ Am Am/G │  /x2/']}]; return parseChart(serializeChart(s)).map(x=>x.c.map(tokens))}, [[[{k:'ch',v:'F'},{k:'ch',v:'C C/B'},{k:'ch',v:'Am Am/G'},{k:'rep',v:'×2'}]]]);
eq('serialize readable', ()=>serializeChart([{l:'Verse',c:['│ G │ C │  /x2/']}]), 'Verse\nG | C  x2');
eq('conflicts', ()=>importConflicts([{id:'mybar'}],[{id:'mybar'},{id:'u1'}]), ['mybar']);
eq('replace', ()=>applyImport([{id:'a',name:'A'},{id:'b',name:'B'}],[{id:'a',name:'A2'}],'replace').map(g=>g.name), ['A2','B']);
eq('keep both', ()=>applyImport([{id:'a',name:'A'}],[{id:'a',name:'A'}],'keep').map(g=>g.id+'/'+g.name), ['a/A','a2/A (2)']);
eq('validate bad', ()=>validateGigFile({kind:'lyrics-pack'}).ok, false);
eq('validate good', ()=>validateGigFile(makeGigFile([{id:'a',name:'A',sets:[]}],'2026-11-11')).ok, true);
eq('newId', ()=>/^[a-z0-9]+$/.test(newId(1731300000000)), true);
eq('flatten round trip', ()=>unflattenGig(flattenGig({sets:[{name:'Set 1',songs:[{title:'X'},{break:'Break'}]},{name:'Set 2',songs:[{title:'Y'}]}]})),
   [{name:'Set 1',songs:[{title:'X'},{break:'Break'}]},{name:'Set 2',songs:[{title:'Y'}]}]);

eq('bpm coerced to number', ()=>validateGigFile({kind:'setlists-gigs',v:1,gigs:[{id:'a',name:'A',sets:[{name:'',songs:[{title:'X',key:'G',bpm:'<img src=x onerror=alert(1)>',sections:[]}]}]}]}).gigs[0].sets[0].songs[0].bpm, null);
eq('bpm numeric kept', ()=>validateGigFile({kind:'setlists-gigs',v:1,gigs:[{id:'a',name:'A',sets:[{name:'',songs:[{title:'X',key:'G',bpm:'96',sections:[]}]}]}]}).gigs[0].sets[0].songs[0].bpm, 96);
eq('only http sources', ()=>validateGigFile({kind:'setlists-gigs',v:1,gigs:[{id:'a',name:'A',sets:[{name:'',songs:[{title:'X',key:'G',sections:[],sources:['javascript:alert(1)','https://ok.example/x']}]}]}]}).gigs[0].sets[0].songs[0].sources, ['https://ok.example/x']);
eq('set without songs gets []', ()=>validateGigFile({kind:'setlists-gigs',v:1,gigs:[{id:'a',name:'A',sets:[{name:'S'}]}]}).gigs[0].sets[0].songs, []);
eq('song defaults', ()=>{const x=validateGigFile({kind:'setlists-gigs',v:1,gigs:[{id:'a',name:'A',sets:[{name:'',songs:[{title:'X'}]}]}]}).gigs[0].sets[0].songs[0]; return [x.key,x.capo,x.sections];}, ['','',[]]);
eq('chord song gets key C', ()=>validateGigFile({kind:'setlists-gigs',v:1,gigs:[{id:'a',name:'A',sets:[{name:'',songs:[{title:'X',sections:[{l:'',c:['G']}]}]}]}]}).gigs[0].sets[0].songs[0].key, 'C');
eq('bad items dropped', ()=>validateGigFile({kind:'setlists-gigs',v:1,gigs:[{id:'a',name:'A',sets:[{name:'',songs:[null,7,{title:''},{break:'B'},{title:'Y',key:'D',sections:[{l:'V',c:['│ D │',5]}]}]}]}]}).gigs[0].sets[0].songs, [{break:'B'},{title:'Y',key:'D',capo:'',sections:[{l:'V',c:['│ D │']}]}]);
eq('sanitizeGigs on stored data', ()=>sanitizeGigs([{id:'a',name:'A',sets:[{name:'S'}]},{id:'BAD id',name:'x',sets:[]}]).map(g=>g.id+':'+g.sets[0].songs.length), ['a:0']);

eq('bars in a line', ()=>lineBeats('│ G │ D │ Am │ C │',4), 16);
eq('repeat multiplies', ()=>lineBeats('│ G │ D │  /x2/',4), 16);
eq('two chords in a box is one bar', ()=>lineBeats('│ F C/E │ Dm7 C │',4), 8);
eq('waltz', ()=>lineBeats('│ G │ C │',3), 6);
eq('notes do not count as bars', ()=>lineBeats('│ G │  kick-kick',4), 4);
eq('more chord names', ()=>['Bbm7b5','Dm7b5','F#m7b5','E7#9','Cmaj7#11','C6/9','Am(maj7)','C+','Bdim7','Gsus4/D','Cadd2'].filter(w=>!isChordWord(w)), []);
eq('words are not chords', ()=>['Main','riff','Intro','Am-ish'].filter(isChordWord), []);
eq('N.C. and % are bars', ()=>lineBeats('│ N.C. │ N.C. │ G │',4), 12);
eq('% repeats a bar', ()=>lineBeats('│ G │ % │ % │ D │',4), 16);
eq('unknown chord still a bar', ()=>lineBeats('│ G │ Bbm7b5 │',4), 8);
eq('no bar lines: each chord a bar', ()=>lineBeats('G D Am C',4), 16);
eq('2x repeat', ()=>parseChart('G | D | Am | C  2x')[0].c, ['G │ D │ Am │ C │  /x2/']);
eq('(2x) repeat beats', ()=>lineBeats(parseChart('G | D  (2x)')[0].c[0],4), 16);
eq('A part is a label', ()=>parseChart('A part\nG | D').map(s=>s.l), ['A part']);
eq('label A survives editing', ()=>parseChart(serializeChart([{l:'A',c:['│ G │ D │']}])).map(s=>s.l), ['A']);
eq('keepMissing keeps songs not sent', ()=>keepMissing({id:'g',name:'G',sets:[{name:'',songs:[{title:'a'},{title:'b'},{title:'c'}]}]},{id:'g',name:'G',sets:[{name:'',songs:[{title:'a',key:'E'}]}]},'title').sets[0].songs.map(x=>x.title+(x.key||'')), ['aE','b','c']);
eq('line with no chords is one bar', ()=>lineBeats('│  /BREAK/',4), 4);
eq('repeat covers bars since the last repeat', ()=>lineBeats('│ C │ G │  /x3/  │ G-F │ D │ C │',4), (2*3+3)*4);
eq('several groups', ()=>lineBeats('│ C │ G │ /x3/ │ G-F │ D │ /x2/ │ G-F │ D │ /x4/',4), (6+4+8)*4);
eq('timeline', ()=>songTimeline([{l:'A',c:['│ G │ D │','│ C │  /x3/']},{l:'',c:['│ G │']}],4).map(x=>[x.start,x.beats]), [[0,8],[8,12],[20,4]]);
eq('timeline default 4/4', ()=>songTimeline([{l:'A',c:['│ G │']}]).map(x=>x.beats), [4]);
}
async function A(){
const big={kind:'setlists-gigs',v:1,from:'Дарин',gigs:[{id:'a',name:'Рейна',sets:[{name:'',songs:[{title:'Бесен',key:'Dm',sections:[{l:'Verse',c:['│ Dm │ Bb │ E │  /x2/'.repeat(40)]}]}]}]}]};
const z=await packShare(big); eq('zip round trip', await unpackShare(z), big);
eq('zip code is url-safe', /^z[A-Za-z0-9_-]+$/.test(z), true);
eq('zip is much shorter', z.length<JSON.stringify(big).length/3, true);
const j=await packShare(big,true); eq('plain round trip', await unpackShare(j), big); eq('plain starts with j', j[0], 'j');
let bad=null; try{ await unpackShare('zNOTvalid'); }catch(e){ bad='threw'; } eq('broken code throws', bad, 'threw');
let cut=null; try{ await unpackShare(z.slice(0,z.length/2)); }catch(e){ cut='threw'; } eq('cut-off link throws', cut, 'threw');
eq('code from pasted message', shareCodeOf('Дарин sent you a gig: https://vibesbg.github.io/setlists/#get=zAb_-9 ok'), 'zAb_-9');
eq('no code', shareCodeOf('#mybar-2'), null);
eq('sender name cleaned', senderName(' Йонко<script>\n '), 'Йонкоscript');
eq('sender name not a string', senderName({}), '');
const gig={id:'g',name:'G',sets:[{name:'Set 1',songs:[{title:'A'},{break:'Break'},{title:'B'}]},{name:'Set 2',songs:[{title:'C'},{title:'D'}]}]};
eq('pick some songs', pickSongs(gig,new Set([0,3])), {id:'g',name:'G',sets:[{name:'Set 1',songs:[{title:'A'}]},{name:'Set 2',songs:[{title:'D'}]}]});
eq('pick drops empty sets', pickSongs(gig,new Set([2])).sets.map(s=>s.name), ['Set 2']);
eq('pick all keeps everything', pickSongs(gig,new Set([0,1,2,3])), gig);

eq('lyrics: chorus label shaded', ()=>parseLyrics('Verse\na\nb\n\nПрипев x2\nc').map(s=>[s.label,s.rep]), [['Verse',false],['Припев x2',true]]);
eq('lyrics merge', ()=>{
  const gigs=[{id:'rayna',name:'Rayna',sets:[{name:'',songs:[{title:'Бесен',key:'Dm',capo:'',sections:[{l:'',c:['Dm']}]}]}]}];
  const pack={gigs:[{id:'rayna',name:'R',sets:[{name:'',songs:[{t:'бесен',a:'',x:'a'},{t:'Нова',a:'X',x:'b'}]}]},{id:'azzaro',name:'Azzaro',sets:[{name:'S1',songs:[{t:'Бесен',a:'',x:''}]}]}],texts:{a:'текст',b:'нов текст'}};
  const o=mergeLyricsPack(gigs,pack,t=>t==='Нова'?'моя поправка':null);
  return [o[0].sets[0].songs.map(x=>[x.title,x.key,x.lyrics||'']), o[1].id, o[1].sets[0].songs[0].lyrics];
}, [[['Бесен','Dm','текст'],['Нова','','моя поправка']],'azzaro','текст']);
eq('same song written two ways', ()=>[songKey2("I don't want to miss a thing")===songKey2("I Don't Wanna Miss a Thing"), songKey2("Knockin’ on heavens door")===songKey2("Knocking On Heaven's Door")], [true,true]);
eq('lyrics merge keeps mine unless replacing', ()=>{ const g=[{id:'a',name:'A',sets:[{name:'',songs:[{title:'X',key:'',capo:'',sections:[],lyrics:'mine'}]}]}], p={gigs:[{id:'a',name:'A',sets:[{name:'',songs:[{t:'X',a:'',x:'k'}]}]}],texts:{k:'theirs'}};
  return [mergeLyricsPack(g,p)[0].sets[0].songs[0].lyrics, mergeLyricsPack(g,p,null,true)[0].sets[0].songs[0].lyrics]; }, ['mine','theirs']);
eq('lyrics survive a file round trip', ()=>validateGigFile(makeGigFile([{id:'a',name:'A',sets:[{name:'',songs:[{title:'X',key:'',capo:'',sections:[],lyrics:'la\nla'}]}]}],'d')).gigs[0].sets[0].songs[0].lyrics, 'la\nla');
eq('fillGaps brings back chords, lyrics and songs, never overwrites', ()=>{
  const cur=[{id:'a',name:'A',sets:[{name:'S1',songs:[{title:'Valerie',key:'',capo:'',sections:[],lyrics:'cloud words'},{title:'Kept',key:'G',capo:'',sections:[{l:'',c:['G']}]}]}]}];
  const old=[{id:'a',name:'A',sets:[{name:'S1',songs:[{title:'valerie',key:'Eb',capo:'1',sections:[{l:'V',c:['Eb']}],lyrics:'old words',bpm:120},{title:'Kept',key:'C',capo:'',sections:[{l:'',c:['C']}]},{title:'Only here',key:'D',capo:'',sections:[]}]}]},{id:'b',name:'B',sets:[]}];
  const o=fillGaps(cur,old), v=o[0].sets[0].songs[0], k=o[0].sets[0].songs[1];
  return [v.key,v.capo,v.sections[0].c[0],v.lyrics,v.bpm,k.key,o[0].sets[0].songs.map(x=>x.title),o.map(g=>g.id),cur[0].sets[0].songs[0].sections.length];
}, ['Eb','1','Eb','cloud words',120,'G',['Valerie','Kept','Only here'],['a','b'],0]);
}
try{T()}catch(e){fails.push('ERROR: '+e.message)}
A().catch(e=>fails.push('ERROR: '+e.message)).then(()=>{ document.body.textContent=fails.length?fails.join('\n'):'PASS '+n; });
</script>
